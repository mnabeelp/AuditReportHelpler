[project]
name = "auditreporthelpler"
version = "0.1.0"
description = "Audit Report Helper: OCR documents/images -> Excel table -> bookkeeping export (Zoho)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pymupdf>=2.0",
    "requests>=2.34.2",
]

[project.scripts]
audit-helper = "audit_helper.cli:main"
audit-helper-web = "audit_helper.web:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "audit_helper"
module-root = "src"
